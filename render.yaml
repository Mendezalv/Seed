services:
  - type: web
    name: seed-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: CORS_ORIGINS
        value: "*"
      - key: INMET_BASE_URL
        value: https://apitempo.inmet.gov.br
      - key: BCB_BASE_URL
        value: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
      - key: CPTEC_BASE_URL
        value: http://servicos.cptec.inpe.br/XML
      - key: BRAPI_BASE_URL
        value: https://brapi.dev/api
