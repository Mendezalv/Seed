services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed_api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://seed:seed_dev@postgres:5432/seed
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./workers:/app/workers
      - ./scripts:/app/scripts
    networks:
      - seed-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: seed_postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: seed
      POSTGRES_USER: seed
      POSTGRES_PASSWORD: seed_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seed -d seed"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seed-network

  redis:
    image: redis:7-alpine
    container_name: seed_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seed-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://seed:seed_dev@postgres:5432/seed
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./workers:/app/workers
    networks:
      - seed-network
    command: celery -A workers.celery_app worker --loglevel=info

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seed_beat
    depends_on:
      - worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://seed:seed_dev@postgres:5432/seed
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./workers:/app/workers
    networks:
      - seed-network
    command: celery -A workers.celery_app beat --loglevel=info

networks:
  seed-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
