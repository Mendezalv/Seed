name: CI/CD - Quality Gate & Container Registry Deploy

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Backend & Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Copy env file
      run: |
        cp .env.example .env

    - name: Run Ruff Lint
      run: |
        ruff check src/ tests/ --exit-zero

    - name: Run Pytest
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=term-missing

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies
      working-directory: frontend
      run: |
        npm ci

    - name: Run Frontend Lint & Build
      working-directory: frontend
      run: |
        npm run lint
        npm run build

  deploy:
    name: Build & Publish Container Images (GHCR)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Downcase Repository Name
      run: |
        echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}/backend:latest
          ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
          ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
